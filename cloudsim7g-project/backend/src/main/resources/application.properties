spring.application.name=cloudsim7g-simulator

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.cloudsim7g=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Database Configuration (H2 - for future use to persist results)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:cloudsim7g
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# VM Provisioning Configuration
provisioning.enabled=true
provisioning.default-timeout-minutes=120
provisioning.auto-cleanup=true
provisioning.auto-cleanup-after-minutes=240

# Cloud Providers Configuration
provisioning.aws.enabled=true
provisioning.aws.default-region=us-east-1

provisioning.azure.enabled=true
provisioning.azure.default-region=eastus

provisioning.local.enabled=true
provisioning.local.default-host=localhost
provisioning.local.default-port=22

