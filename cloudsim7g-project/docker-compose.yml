version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudsim7g-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloudsim7g
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudsim-network

  redis:
    image: redis:7-alpine
    container_name: cloudsim7g-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cloudsim-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudsim7g-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cloudsim7g
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - cloudsim-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudsim7g-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_WS_URL=ws://localhost:8080/ws
    depends_on:
      - backend
    networks:
      - cloudsim-network

volumes:
  postgres_data:
  redis_data:

networks:
  cloudsim-network:
    driver: bridge
